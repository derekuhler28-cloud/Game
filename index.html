<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Pirate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device" aria-label="Pocket Pirate">
  <header class="status">
    <div class="status-who" id="hud" hidden>
      <span id="hudName" class="hud-name"></span>
      <span id="hudLv" class="lv"></span>
      <span id="hudStatus" class="chip" hidden></span>
    </div>
    <span id="hudBerries" class="gold" hidden></span>
    <button type="button" id="muteBtn" class="icon-btn" aria-label="Sound" aria-pressed="true"></button>
  </header>

  <div class="screen-frame">
    <canvas id="screen" width="192" height="128" aria-label="Game screen"></canvas>
  </div>
  <h1 class="brand">Pocket Pirate</h1>

  <div class="meters" id="meters" hidden></div>

  <div class="msg" id="msg" role="button" tabindex="0" aria-label="Message box. Tap to continue.">
    <p id="msgText"></p>
    <span class="msg-more" aria-hidden="true">&#9660;</span>
  </div>
  <p id="srMsg" class="sr-only" aria-live="polite"></p>

  <nav class="actions" id="actions" aria-label="Actions"></nav>
  <nav class="dock" id="dock" aria-label="Menu" hidden></nav>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="panel">
    <div class="panel-head">
      <h2 id="modalTitle"></h2>
      <button type="button" id="modalClose" class="close" aria-label="Close">X</button>
    </div>
    <div class="panel-body" id="modalBody"></div>
  </div>
</div>

<script src="js/gfx.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/gear.js"></script>
<script src="js/moves.js"></script>
<script src="js/game.js"></script>
</body>
</html>
